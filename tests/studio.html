<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>承艺 · 摄影棚</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #e4ddd2; } canvas { width: 100%; height: 100%; display: block; }</style>
<script type="importmap">
{ "imports": { "three": "../js/vendor/three.module.min.js" } }
</script>
</head>
<body>
<!-- 单独查看写实器物：?craft=ceramic&shape=vase&color=white&pattern=flower&step=2&width=1&complexity=1&variant= -->
<canvas id="c"></canvas>
<script type="module">
import { createStudio } from '../js/render/studio.js';
const q = new URLSearchParams(location.search);
const craft = q.get('craft') || 'ceramic';
const state = {
  shape: q.get('shape') || (craft === 'paper' ? 'round' : 'vase'),
  color: q.get('color') || (craft === 'paper' ? 'red' : 'white'),
  pattern: q.get('pattern') || 'flower',
  step: Number(q.get('step') ?? 2),
  width: Number(q.get('width') || 1),
  complexity: Number(q.get('complexity') || 1),
};
const studio = createStudio(document.getElementById('c'));
studio.show(craft, state, { variant: q.get('variant') });
if (q.get('yaw')) studio.rotate(Number(q.get('yaw')));
if (q.get('intro')) studio.compose('intro', { immediate: true });
studio.setReduced(true);
studio.setActive(true);
</script>
</body>
</html>
