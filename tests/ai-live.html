<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>承艺 · 大模型联调</title>
<style>
  body { margin: 0; font: 13px/1.6 ui-monospace, Menlo, monospace; background: #111; color: #ddd; }
  iframe { width: 1440px; height: 900px; border: 0; display: block; }
  #log { padding: 12px 16px; white-space: pre-wrap; }
  .pass { color: #8fd18f; } .fail { color: #f08a7a; }
</style>
</head>
<body>
<!-- 连真实后台（server/，需先启动）：山河里问一句、创作台里问一句，记下回答、来源和耗时。
     会真实调用 Dify，产生少量费用；冒烟测试不依赖它。 -->
<iframe id="app" src="../index.html#explore"></iframe>
<pre id="log"></pre>
<script>
const log = document.getElementById('log');
const results = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
function check(name, ok, detail = '') {
  results.push(ok);
  log.insertAdjacentHTML('beforeend', `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span> ${name}${detail ? ' — ' + detail : ''}\n`);
}

async function run() {
  const doc = document.getElementById('app').contentDocument;
  const win = document.getElementById('app').contentWindow;
  const $ = id => doc.getElementById(id);
  const tap = el => {
    const r = el.getBoundingClientRect();
    const opts = { bubbles: true, button: 0, pointerId: 1, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 };
    el.dispatchEvent(new win.PointerEvent('pointerdown', opts));
    el.dispatchEvent(new win.PointerEvent('pointerup', opts));
  };
  // 等到这条回答写完（不再显示「正在查」），最多 60 秒
  const ask = async text => {
    const before = doc.querySelectorAll('#messages .message.ai').length;
    const t0 = performance.now();
    $('chat-input').value = text;
    $('chat-form').requestSubmit();
    for (let i = 0; i < 240; i++) {
      await wait(250);
      const all = doc.querySelectorAll('#messages .message.ai');
      const last = all[all.length - 1];
      if (all.length > before && !last.querySelector('.typing') && !$('chat-form').querySelector('button').disabled) {
        return { el: last, s: ((performance.now() - t0) / 1000).toFixed(1) };
      }
    }
    return { el: null, s: '60+' };
  };
  const show = r => r.el ? `${r.s}s · ${r.el.querySelector('span').textContent.slice(0, 80)}… · ${r.el.querySelector('.kb-source')?.textContent || '无知识库来源'}` : '超时';

  for (let i = 0; i < 150 && !doc.querySelector('.place'); i++) await wait(200);
  tap(doc.querySelector('[data-region="江西"]'));
  await wait(400);
  $('voice-toggle').click();
  for (let i = 0; i < 20 && $('chat-disclaimer').textContent.includes('正在连接'); i++) await wait(250);
  check('后台已连上', $('chat-disclaimer').textContent.includes('大模型'), $('chat-disclaimer').textContent);

  let r = await ask('景德镇的瓷器有什么特别？');
  check('山河：大模型回答', !!r.el && !r.el.querySelector('.ai-note'), show(r));

  doc.querySelector('[data-view="workshop"]').click();
  await wait(400);
  if ($('work-layout').hidden) { doc.querySelector('[data-hotspot="start"]').click(); await wait(600); }
  r = await ask('这件作品入窑以后会发生什么变化？');
  check('创作台：大模型回答', !!r.el && !r.el.querySelector('.ai-note'), show(r));

  const passed = results.filter(Boolean).length;
  log.insertAdjacentHTML('afterbegin', `RESULT ${passed}/${results.length}\n`);
  document.title = `RESULT ${passed}/${results.length}`;
}
document.getElementById('app').addEventListener('load', () => run().catch(e => {
  log.insertAdjacentHTML('beforeend', `<span class="fail">CRASH</span> ${e.stack || e}\n`);
}));
</script>
</body>
</html>
